[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-cache-sqlite"
version = "0.1.0"
description = "Ultra-fast local SQLite-based vector cache for frequent agent queries with cosine similarity matching"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
semantic-cache-sqlite = "semantic_cache_sqlite.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_cache_sqlite*"]
